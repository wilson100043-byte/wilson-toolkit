<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wilson’s Toolkit — 實用工具的共用入口。" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Wilson’s Toolkit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A0A0A'/><path d='M17 20l8 25 7-17 7 17 8-25' fill='none' stroke='%23F6F6F2' stroke-width='6' stroke-linejoin='round'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!--
      THESIS: The tools appear as their real interfaces in a quiet rotating field, refusing both a route metaphor and a text-heavy portfolio index.
      OWN-WORLD: Near-black space, pearl type, oversized live screenshots, soft depth and one precise circular motion system.
      STORY: Visitors recognize a tool by sight, rotate the collection by dragging, then open the front card.
      FIRST VIEWPORT: A tiny masthead frames one full-screen 3D ring; one screenshot dominates the center while the other tools remain visible at its edges.
      FORM: Code-led circular gallery adapted to the supplied component; user-pinned seed user-pinned-39b98dd9; signature interaction is inertial pointer dragging with hover lift.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#gallery">跳到工具選擇</a>

    <header class="site-header">
      <a class="wordmark" href="./" aria-label="Wilson’s Toolkit 首頁">WILSON / TOOLS</a>
    </header>

    <main>
      <h1 class="sr-only">Wilson’s Toolkit</h1>
      <section id="gallery" class="gallery" aria-labelledby="gallery-title">
        <h2 id="gallery-title" class="sr-only">工具首頁</h2>
        <p id="gallery-help" class="sr-only">
          拖曳或使用左右方向鍵旋轉工具。聚焦中央卡片後按 Enter 可在新分頁開啟。
        </p>

        <div
          id="gallery-viewport"
          class="gallery__viewport"
          role="region"
          tabindex="0"
          aria-describedby="gallery-help"
          aria-roledescription="3D 工具輪播"
        >
          <div id="gallery-ring" class="gallery__ring"></div>
        </div>

        <nav id="gallery-nav" class="gallery__nav" aria-label="選擇工具"></nav>
        <div id="gallery-status" class="sr-only" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
